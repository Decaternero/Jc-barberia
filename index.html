<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JC Barbería</title><style>body{margin:0;background:#0d1418;color:#f2f7f8;font:14px Arial}#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0a1014,#16353a)}.box{width:min(400px,90%);background:#172228;padding:30px;border-radius:18px;text-align:center}.logo{font-size:30px;font-weight:900;letter-spacing:2px}.muted{color:#9fb0b8;font-size:12px}.field{text-align:left;margin:12px 0}.field label{display:block;color:#9fb0b8;font-size:12px;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #2c3b43;border-radius:8px;background:#0f181d;color:white}button{width:100%;padding:11px;border:0;border-radius:8px;background:#0f8b8d;color:white;font-weight:700}.err{color:#ff9c9c;min-height:20px;margin:10px}#app{display:none;width:100vw;height:100vh}iframe{width:100%;height:100%;border:0}</style></head><body><div id="login"><div class="box"><div class="logo">JC BARBERÍA</div><p class="muted">Sistema de gestión interna</p><div class="field"><label>Usuario</label><input id="u" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"></div><button onclick="go()">Ingresar</button><div id="err" class="err"></div></div></div><div id="app"><iframe id="frame" src="JC_Barberia_Actualizada_Productos_Stock.html"></iframe></div><script>const KEY='JC_BARBERIA_V8';let timer;async function go(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({u,p})});if(!r.ok){document.getElementById('err').textContent='Credenciales inválidas';return}const me=await r.json();const d=await fetch('/api/db',{credentials:'include'});const db=await d.json();const f=document.getElementById('frame');f.onload=()=>{try{f.contentWindow.localStorage.setItem(KEY,JSON.stringify(db));f.contentWindow.sessionStorage.setItem('JC_USER',JSON.stringify(me));f.contentWindow.location.reload()}catch(e){}};f.src='JC_Barberia_Actualizada_Productos_Stock.html?'+Date.now();document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';startSync()}catch(e){document.getElementById('err').textContent='No se pudo conectar con el servidor'}}async function startSync(){clearInterval(timer);let last='';timer=setInterval(async()=>{try{const f=document.getElementById('frame'),s=f.contentWindow.localStorage.getItem(KEY);if(!s||s===last)return;last=s;await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:s})}catch(e){}},1500)}async function restore(){try{const r=await fetch('/api/me',{credentials:'include'});if(!r.ok)return;const me=await r.json();const d=await fetch('/api/db',{credentials:'include'});if(!d.ok)return;const db=await d.json();const f=document.getElementById('frame');f.onload=()=>{try{f.contentWindow.localStorage.setItem(KEY,JSON.stringify(db));f.contentWindow.sessionStorage.setItem('JC_USER',JSON.stringify(me));f.contentWindow.location.reload()}catch(e){}};document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';startSync()}catch(e){}}restore();</script></body></html>
