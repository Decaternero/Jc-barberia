<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JC Barbería - Gestión</title>
<style>
:root{--bg:#0d1418;--panel:#172228;--panel2:#203039;--text:#f2f7f8;--muted:#9fb0b8;--accent:#0f8b8d;--danger:#d9534f;--warn:#b58105;--ok:#2e9b68;--line:#2c3b43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select{font:inherit}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#3a4a53}button.danger{background:var(--danger)}button.small{padding:6px 9px;font-size:12px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0a1014,#16353a)}
.loginbox{width:min(400px,100%);background:var(--panel);padding:30px;border-radius:18px;text-align:center;box-shadow:0 20px 60px #0009}.logo{font-size:30px;font-weight:900;letter-spacing:2px}.muted{color:var(--muted);font-size:12px}.field{display:grid;gap:5px;margin:10px 0;text-align:left}.field label{color:var(--muted);font-size:12px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0f181d;color:var(--text)}.err{color:#ff9c9c;min-height:22px;margin:10px}
#app{display:none}.top{height:60px;position:sticky;top:0;z-index:5;background:#111b20;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 15px}.brand{font-weight:900}.layout{display:flex;min-height:calc(100vh - 60px)}
aside{width:220px;background:#111b20;border-right:1px solid var(--line);padding:10px;position:sticky;top:60px;height:calc(100vh - 60px)}aside button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);margin:3px 0}aside button:hover,aside button.active{background:var(--panel2);color:#fff}
main{flex:1;padding:18px;min-width:0}.view{display:none}.view.active{display:block}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.metric{font-size:25px;font-weight:900;margin-top:7px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.full{grid-column:1/-1}.tablewrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#1b282f}.badge{padding:4px 7px;border-radius:20px;font-size:11px}.ok{background:#174b36}.bad{background:#592525}.warning{background:#59470e}.notice{padding:11px;border-radius:9px;background:#25343b;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;place-items:center;padding:15px}.modal.show{display:grid}.modalbox{background:var(--panel);border-radius:14px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.layout{display:block}aside{width:100%;height:auto;position:static;display:grid;grid-template-columns:repeat(3,1fr)}aside button{font-size:11px;padding:8px}main{padding:12px}.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login">
<div class="loginbox">
<div class="logo">JC BARBERÍA</div><p class="muted">Sistema de gestión interna</p>
<div class="field"><label>Usuario</label><input id="lu" autocomplete="username"></div>
<div class="field"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div>
<button style="width:100%" onclick="login()">Ingresar</button><div id="le" class="err"></div>
</div></div>

<div id="app">
<header class="top"><div class="brand">JC BARBERÍA</div><div><span id="user" class="muted"></span> <button class="small secondary" onclick="logout()">Salir</button></div></header>
<div class="layout">
<aside>
<button data-v="dashboard" onclick="view('dashboard')">🏠 Inicio</button>
<button data-v="ventas" onclick="view('ventas')">💰 Ventas</button>
<button data-v="clientes" onclick="view('clientes')">👥 Clientes</button>
<button data-v="membresias" onclick="view('membresias')">🎫 Membresías</button>
<button data-v="barberos" onclick="view('barberos')">✂️ Barberos</button>
<button data-v="agenda" onclick="view('agenda')">📅 Agenda</button>
<button data-v="stock" onclick="view('stock')">📦 Stock</button>
<button data-v="gastos" onclick="view('gastos')">💸 Gastos</button>
<button data-v="caja" onclick="view('caja')">🧾 Caja</button>
<button data-v="reportes" onclick="view('reportes')">📊 Reportes</button>
<button data-v="config" onclick="view('config')">⚙️ Configuración</button>
</aside>
<main>
<section id="dashboard" class="view"></section><section id="ventas" class="view"></section>
<section id="clientes" class="view"></section><section id="membresias" class="view"></section>
<section id="barberos" class="view"></section><section id="agenda" class="view"></section>
<section id="stock" class="view"></section><section id="gastos" class="view"></section>
<section id="caja" class="view"></section><section id="reportes" class="view"></section>
<section id="config" class="view"></section>
</main></div></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="small secondary" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>

<script>
const USERS=[{u:"admin",p:"admin123",role:"admin",name:"Administrador"},{u:"barbero",p:"barbero123",role:"barbero",name:"Barbero"}];
const SERVICES=[["Corte clásico",18],["Corte degradado",20],["Corte + barba",30],["Perfilado de barba",10],["Perfilado de cejas",5],["Diseño",10],["Mascarilla facial",10],["Vapor facial",10],["Limpieza facial",15],["Mascarilla + vapor",20],["Lavado de cabello",10],["Combo Fresh",28],["Combo Barber",30],["Combo Premium",40]];
const PLANS=[["Básico",30,40,2,1],["Smart",60,70,4,2],["Premium",90,100,6,3]];
const KEY="JC_BARBERIA_V8";
let db=load(),me=null,currentView="dashboard";
function fresh(){return{clients:[],sales:[],memberships:[],barbers:[{id:gid(),name:"Barbero principal",phone:"",start:today(),active:true,mode:"percentage",percent:50,rent:0}],stock:[],movements:[],expenses:[],appointments:[],closures:[],audit:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function money(x){return "S/ "+Number(x||0).toFixed(2)}
function e(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function val(id){return document.getElementById(id).value}
function admin(){return me&&me.role==="admin"}
function bname(id){return db.barbers.find(x=>x.id===id)?.name||"—"}
function cname(id){return db.clients.find(x=>x.id===id)?.name||"Cliente ocasional"}
function log(a,d){db.audit.push({id:gid(),date:new Date().toLocaleString("es-PE"),user:me?.u||"",action:a,detail:d});save()}
function login(){let x=USERS.find(x=>x.u===val("lu").trim()&&x.p===val("lp"));if(!x){document.getElementById("le").textContent="Credenciales inválidas";return}me=x;sessionStorage.setItem("JC_USER",JSON.stringify(x));document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("user").textContent=x.name+" · "+x.role;renderAll()}
function logout(){sessionStorage.removeItem("JC_USER");location.reload()}
try{me=JSON.parse(sessionStorage.getItem("JC_USER"))}catch(_){}
if(me){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("user").textContent=me.name+" · "+me.role}
function view(v){currentView=v;document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll("aside button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));render(v)}
function renderAll(){["dashboard","ventas","clientes","membresias","barberos","agenda","stock","gastos","caja","reportes","config"].forEach(render);view(currentView)}
function render(v){if(v==="dashboard")dash();if(v==="ventas")sales();if(v==="clientes")clients();if(v==="membresias")members();if(v==="barberos")barbers();if(v==="agenda")agenda();if(v==="stock")stock();if(v==="gastos")expenses();if(v==="caja")cash();if(v==="reportes")reports();if(v==="config")config()}
function dash(){let m=today().slice(0,7),ss=db.sales.filter(s=>!s.annulled&&s.date.startsWith(m)),inc=ss.reduce((a,s)=>a+s.total,0),ex=db.expenses.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.amount,0),low=db.stock.filter(p=>p.qty<=p.min).length,exp=db.memberships.filter(x=>new Date(x.expires+"T23:59:59")<new Date()).length;document.getElementById("dashboard").innerHTML=`<h1>Inicio</h1><div class="grid"><div class="card">Ventas del mes<div class="metric">${money(inc)}</div></div><div class="card">Gastos<div class="metric">${money(ex)}</div></div><div class="card">Resultado<div class="metric">${money(inc-ex)}</div></div><div class="card">Clientes<div class="metric">${db.clients.length}</div></div></div><div class="card"><b>Alertas</b><p>${low?`⚠️ ${low} producto(s) con stock bajo`:"✅ Stock normal"}</p><p>${exp?`⚠️ ${exp} membresía(s) vencida(s)`:"✅ No hay membresías vencidas"}</p></div>`}
function barberSelect(id="barber"){return`<select id="${id}">${db.barbers.filter(b=>b.active).map(b=>`<option value="${b.id}">${e(b.name)}</option>`).join("")}</select>`}
function sales(){let products=db.stock.filter(p=>p.qty>0);document.getElementById("ventas").innerHTML=`<h1>Ventas</h1>
<div class="card"><div class="toolbar"><button id="tabService" onclick="saleMode('service')">💈 Servicio</button><button class="secondary" onclick="saleMode('product')">🛒 Producto</button></div>
<div id="saleForm"></div></div>
<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Cliente</th><th>Barbero</th><th>Cant.</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody>${db.sales.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${s.kind==="product"?"Producto":"Servicio"}</td><td>${e(s.detail)}</td><td>${e(cname(s.clientId))}</td><td>${e(bname(s.barberId))}</td><td>${s.qty||1}</td><td>${money(s.total)}</td><td>${e(s.pay)}</td><td><span class="badge ${s.annulled?"bad":"ok"}">${s.annulled?"ANULADA":"VÁLIDA"}</span></td><td>${admin()&&!s.annulled?`<button class="small danger" onclick="annul('${s.id}')">Anular</button>`:""}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">No hay ventas.</td></tr>`}</tbody></table></div>`;saleMode("service")}
function commonSaleFields(){return`<div class="formgrid"><div class="field"><label>Fecha</label><input id="sd" type="date" value="${today()}"></div><div class="field"><label>Cliente</label><select id="sc"><option value="">Cliente ocasional</option>${db.clients.map(c=>`<option value="${c.id}">${e(c.name)} · ${e(c.phone)}</option>`).join("")}</select></div><div class="field"><label>Barbero</label>${barberSelect("sb")}</div><div class="field"><label>Método de pago</label><select id="sp"><option>Efectivo</option><option>Yape/Plin</option><option>Tarjeta</option></select></div></div>`}
function saleMode(mode){let f=document.getElementById("saleForm");if(!f)return;if(mode==="service")f.innerHTML=commonSaleFields()+`<div class="formgrid"><div class="field"><label>Servicio</label><select id="sv">${SERVICES.map((s,i)=>`<option value="${i}">${s[0]} — ${money(s[1])}</option>`).join("")}</select></div><div class="field"><label>Precio</label><input id="spr" type="number" step=".01" value="${SERVICES[0][1]}"></div></div><button onclick="saveServiceSale()">Registrar servicio</button>`;else f.innerHTML=commonSaleFields()+`<div class="formgrid"><div class="field"><label>Producto</label><select id="pp">${db.stock.map(p=>`<option value="${p.id}" ${p.qty<=0?"disabled":""}>${e(p.name)} · ${money(p.sale)} · stock ${p.qty}</option>`).join("")}</select></div><div class="field"><label>Cantidad</label><input id="pq" type="number" min="1" value="1" oninput="updateProductTotal()"></div><div class="field"><label>Precio unitario</label><input id="ppr" type="number" step=".01" readonly></div><div class="field"><label>Total</label><input id="pt" type="number" step=".01" readonly></div></div><div class="notice">Al confirmar, el stock se descontará automáticamente. Si se anula la venta, el stock será devuelto.</div><button onclick="saveProductSale()">🛒 Registrar venta de producto</button>`;if(mode==="service")document.getElementById("sv").onchange=()=>document.getElementById("spr").value=SERVICES[+val("sv")][1];else{document.getElementById("pp").onchange=updateProductTotal;updateProductTotal()}}
function updateProductTotal(){let p=db.stock.find(x=>x.id===val("pp")),q=+val("pq");if(p){document.getElementById("ppr").value=p.sale;document.getElementById("pt").value=(p.sale*q).toFixed(2)}}
function saveServiceSale(){let s={id:gid(),date:val("sd"),kind:"service",detail:SERVICES[+val("sv")][0],clientId:val("sc"),barberId:val("sb"),qty:1,total:+val("spr"),pay:val("sp"),annulled:false,createdBy:me.u,createdAt:new Date().toLocaleString("es-PE")};if(s.total<0)return alert("Precio inválido.");db.sales.push(s);log("Venta de servicio",s.detail+" "+money(s.total));save();renderAll()}
function saveProductSale(){let p=db.stock.find(x=>x.id===val("pp")),q=Math.floor(+val("pq"));if(!p)return alert("Selecciona un producto.");if(!q||q<1)return alert("Cantidad inválida.");if(q>p.qty)return alert("No hay suficiente stock. Disponible: "+p.qty);let total=p.sale*q;let s={id:gid(),date:val("sd"),kind:"product",productId:p.id,detail:p.name,clientId:val("sc"),barberId:val("sb"),qty:q,unitPrice:p.sale,costUnit:p.cost,total,pay:val("sp"),annulled:false,createdBy:me.u,createdAt:new Date().toLocaleString("es-PE")};p.qty-=q;db.movements.push({id:gid(),productId:p.id,type:"sale",qty:q,before:p.qty+q,after:p.qty,reason:"Venta "+s.id,date:new Date().toLocaleString("es-PE"),by:me.u});db.sales.push(s);log("Venta de producto",p.name+" x"+q+" | stock "+(p.qty+q)+"→"+p.qty);save();renderAll();alert("Venta registrada. Stock actualizado: "+p.qty)}
function annul(id){if(!admin())return alert("Solo administrador.");let s=db.sales.find(x=>x.id===id);if(!s||s.annulled)return;let r=prompt("Motivo de la anulación:");if(!r)return;if(s.kind==="product"){let p=db.stock.find(x=>x.id===s.productId);if(p){let old=p.qty;p.qty+=s.qty;db.movements.push({id:gid(),productId:p.id,type:"return",qty:s.qty,before:old,after:p.qty,reason:"Anulación de venta "+s.id,date:new Date().toLocaleString("es-PE"),by:me.u})}}s.annulled=true;s.reason=r;s.annulledBy=me.u;s.annulledAt=new Date().toLocaleString("es-PE");log("Venta anulada",s.detail+" | "+r);save();renderAll()}
function clients(){document.getElementById("clientes").innerHTML=`<h1>Clientes</h1><div class="card"><div class="formgrid"><div class="field"><label>Nombre</label><input id="cn"></div><div class="field"><label>Teléfono</label><input id="cp"></div><div class="field"><label>Notas</label><input id="co"></div></div><button onclick="addClient()">Guardar cliente</button></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Última visita</th><th>Total gastado</th><th>Acción</th></tr></thead><tbody>${db.clients.map(c=>{let s=db.sales.filter(x=>x.clientId===c.id&&!x.annulled);return`<tr><td>${e(c.name)}</td><td>${e(c.phone)}</td><td>${s.length?Math.max(...s.map(x=>x.date)):"—"}</td><td>${money(s.reduce((a,x)=>a+x.total,0))}</td><td>${admin()?`<button class="small danger" onclick="delClient('${c.id}')">Eliminar</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`}
function addClient(){let n=val("cn").trim();if(!n)return alert("Nombre requerido.");db.clients.push({id:gid(),name:n,phone:val("cp"),notes:val("co")});log("Cliente creado",n);save();renderAll()}
function delClient(id){if(confirm("¿Eliminar cliente? Las ventas se conservarán como ocasionales.")){db.sales.forEach(s=>{if(s.clientId===id)s.clientId=""});db.memberships=db.memberships.filter(m=>m.clientId!==id);db.clients=db.clients.filter(c=>c.id!==id);log("Cliente eliminado",id);save();renderAll()}}
function members(){document.getElementById("membresias").innerHTML=`<h1>Membresías</h1><div class="notice">Básico S/40: 2 cortes + 1 mascarilla/vapor · Smart S/70: 4 + 2 · Premium S/100: 6 + 3. Los beneficios pueden transferirse a una persona.</div><div class="grid">${PLANS.map((p,i)=>`<div class="card"><h2>${p[0]}</h2><div class="metric">${money(p[2])}</div><p>${p[1]} días</p><p>${p[3]} cortes degradado</p><p>${p[4]} mascarilla + vapor</p><button onclick="buyMember(${i})">Registrar</button></div>`).join("")}</div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Plan</th><th>Vigencia</th><th>Cortes</th><th>M+V</th><th>Estado</th><th></th></tr></thead><tbody>${db.memberships.slice().reverse().map(m=>`<tr><td>${e(cname(m.clientId))}</td><td>${m.plan}</td><td>${m.start} → ${m.expires}</td><td>${m.cuts}</td><td>${m.masks}</td><td>${new Date(m.expires+"T23:59:59")<new Date()?"Vencida":(m.cuts||m.masks?"Activa":"Agotada")}</td><td>${m.cuts||m.masks?`<button class="small" onclick="useMember('${m.id}')">Usar</button>`:""}</td></tr>`).join("")}</tbody></table></div>`}
function buyMember(i){let p=PLANS[i];openModal("Nueva membresía",`<div class="formgrid"><div class="field"><label>Cliente</label><select id="mc">${db.clients.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join("")}</select></div><div class="field"><label>Inicio</label><input id="ms" type="date" value="${today()}"></div><div class="field"><label>Barbero</label>${barberSelect("mbb")}</div><div class="field"><label>Persona autorizada</label><input id="mh"></div></div><button onclick="saveMember(${i})">Guardar</button>`)}
function saveMember(i){let p=PLANS[i];if(!val("mc"))return alert("Crea un cliente primero.");let d=new Date(val("ms")+"T12:00:00");d.setDate(d.getDate()+p[1]-1);db.memberships.push({id:gid(),clientId:val("mc"),plan:p[0],price:p[2],start:val("ms"),expires:d.toISOString().slice(0,10),cuts:p[3],masks:p[4],holder:val("mh"),barberId:val("mbb"),uses:[]});log("Membresía creada",p[0]);save();closeModal();renderAll()}
function useMember(id){let m=db.memberships.find(x=>x.id===id);if(new Date(m.expires+"T23:59:59")<new Date())return alert("Membresía vencida.");openModal("Usar beneficio",`<div class="formgrid"><div class="field"><label>Beneficio</label><select id="ut">${m.cuts?'<option value="cut">Corte degradado</option>':""}${m.masks?'<option value="mask">Mascarilla + vapor</option>':""}</select></div><div class="field"><label>Fecha</label><input id="ud" type="date" value="${today()}"></div><div class="field"><label>Barbero</label>${barberSelect("ubb")}</div></div><button onclick="saveUse('${id}')">Registrar uso</button>`)}
function saveUse(id){let m=db.memberships.find(x=>x.id===id),t=val("ut");if(t==="cut"&&!m.cuts)return alert("No quedan cortes.");if(t==="mask"&&!m.masks)return alert("No quedan mascarilla + vapor.");if(t==="cut")m.cuts--;else m.masks--;m.uses.push({date:val("ud"),type:t,barberId:val("ubb"),by:me.u,at:new Date().toLocaleString("es-PE"),cuts:m.cuts,masks:m.masks});log("Beneficio usado",m.plan+" "+t);save();closeModal();renderAll()}
function barbers(){document.getElementById("barberos").innerHTML=`<h1>Barberos</h1><div class="card"><div class="formgrid"><div class="field"><label>Nombre</label><input id="bn"></div><div class="field"><label>Teléfono</label><input id="bt"></div><div class="field"><label>Inicio</label><input id="bs" type="date" value="${today()}"></div><div class="field"><label>Modalidad</label><select id="bm"><option value="percentage">Porcentaje</option><option value="rent">Alquiler de silla</option></select></div><div class="field"><label>% barbero</label><input id="bpc" type="number" value="50"></div><div class="field"><label>Alquiler mensual</label><input id="br" type="number" value="0"></div></div><button onclick="addBarber()">Agregar barbero</button></div><div class="tablewrap"><table><thead><tr><th>Barbero</th><th>Modalidad</th><th>%</th><th>Alquiler</th><th>Ventas mes</th><th>Comisión</th></tr></thead><tbody>${db.barbers.map(b=>{let s=db.sales.filter(x=>x.barberId===b.id&&!x.annulled&&x.date.startsWith(today().slice(0,7))),t=s.reduce((a,x)=>a+x.total,0);return`<tr><td>${e(b.name)} ${b.active?"":"(inactivo)"}</td><td>${b.mode}</td><td>${b.percent}%</td><td>${money(b.rent)}</td><td>${money(t)}</td><td>${money(b.mode==="percentage"?t*b.percent/100:0)}</td></tr>`}).join("")}</tbody></table></div>`}
function addBarber(){let n=val("bn").trim();if(!n)return;db.barbers.push({id:gid(),name:n,phone:val("bt"),start:val("bs"),active:true,mode:val("bm"),percent:+val("bpc")||0,rent:+val("br")||0});log("Barbero creado",n);save();renderAll()}
function agenda(){document.getElementById("agenda").innerHTML=`<h1>Agenda</h1><div class="card"><div class="formgrid"><div class="field"><label>Fecha</label><input id="ad" type="date" value="${today()}"></div><div class="field"><label>Hora</label><input id="at" type="time"></div><div class="field"><label>Cliente</label><select id="ac">${db.clients.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join("")}</select></div><div class="field"><label>Barbero</label>${barberSelect("abb")}</div><div class="field"><label>Servicio</label><select id="as">${SERVICES.map(s=>`<option>${e(s[0])}</option>`).join("")}</select></div><div class="field"><label>Estado</label><select id="ast"><option>Pendiente</option><option>Confirmada</option><option>Atendida</option><option>Cancelada</option></select></div></div><button onclick="addAppt()">Guardar cita</button></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Barbero</th><th>Servicio</th><th>Estado</th></tr></thead><tbody>${db.appointments.map(a=>`<tr><td>${a.date}</td><td>${a.time}</td><td>${e(cname(a.clientId))}</td><td>${e(bname(a.barberId))}</td><td>${e(a.service)}</td><td>${a.status}</td></tr>`).join("")}</tbody></table></div>`}
function addAppt(){db.appointments.push({id:gid(),date:val("ad"),time:val("at"),clientId:val("ac"),barberId:val("abb"),service:val("as"),status:val("ast")});save();renderAll()}
function stock(){document.getElementById("stock").innerHTML=`<h1>Stock</h1><div class="notice">Las ventas de productos descuentan stock automáticamente. Una anulación administrativa devuelve las unidades al inventario.</div><div class="card">${admin()?`<div class="formgrid"><div class="field"><label>Producto</label><input id="pn"></div><div class="field"><label>Stock inicial</label><input id="pq0" type="number" value="0"></div><div class="field"><label>Mínimo</label><input id="pmin" type="number" value="2"></div><div class="field"><label>Costo</label><input id="pc" type="number" step=".01" value="0"></div><div class="field"><label>Precio venta</label><input id="ps" type="number" step=".01" value="0"></div></div><button onclick="addProduct()">Agregar producto</button>`:"Solo administrador puede agregar/modificar stock."}</div><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Costo</th><th>Venta</th><th>Valor</th><th>Estado</th><th>Mov.</th></tr></thead><tbody>${db.stock.map(p=>`<tr><td>${e(p.name)}</td><td>${p.qty}</td><td>${p.min}</td><td>${money(p.cost)}</td><td>${money(p.sale)}</td><td>${money(p.qty*p.cost)}</td><td><span class="badge ${p.qty<=p.min?"warning":"ok"}">${p.qty<=p.min?"BAJO":"OK"}</span></td><td>${admin()?`<button class="small" onclick="moveStock('${p.id}')">Movimiento</button>`:"—"}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">No hay productos.</td></tr>`}</tbody></table></div>`}
function addProduct(){let n=val("pn").trim();if(!n)return;db.stock.push({id:gid(),name:n,qty:+val("pq0")||0,min:+val("pmin")||0,cost:+val("pc")||0,sale:+val("ps")||0});log("Producto creado",n);save();renderAll()}
function moveStock(id){if(!admin())return;openModal("Movimiento de stock",`<div class="formgrid"><div class="field"><label>Tipo</label><select id="mtx"><option value="in">Entrada</option><option value="out">Salida</option><option value="adjust">Ajuste</option></select></div><div class="field"><label>Cantidad</label><input id="mqty" type="number" value="1"></div></div><button onclick="saveMove('${id}')">Guardar</button>`)}
function saveMove(id){let p=db.stock.find(x=>x.id===id),q=+val("mqty"),old=p.qty;if(val("mtx")==="in")p.qty+=q;else if(val("mtx")==="out")p.qty=Math.max(0,p.qty-q);else p.qty=q;db.movements.push({id:gid(),productId:id,type:val("mtx"),qty:q,before:old,after:p.qty,date:new Date().toLocaleString("es-PE"),by:me.u});log("Movimiento stock",p.name+" "+old+"→"+p.qty);save();closeModal();renderAll()}
function expenses(){document.getElementById("gastos").innerHTML=`<h1>Gastos</h1>${admin()?`<div class="card"><div class="formgrid"><div class="field"><label>Fecha</label><input id="gd" type="date" value="${today()}"></div><div class="field"><label>Concepto</label><input id="gc"></div><div class="field"><label>Monto</label><input id="ga" type="number" step=".01"></div><div class="field"><label>Categoría</label><select id="gx"><option>Productos</option><option>Alquiler</option><option>Servicios</option><option>Sueldos</option><option>Otros</option></select></div></div><button onclick="addExpense()">Registrar</button></div>`:"<div class='notice'>Solo administrador.</div>"}<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Monto</th><th>Usuario</th></tr></thead><tbody>${db.expenses.map(g=>`<tr><td>${g.date}</td><td>${e(g.concept)}</td><td>${e(g.cat)}</td><td>${money(g.amount)}</td><td>${g.by}</td></tr>`).join("")}</tbody></table></div>`}
function addExpense(){let a=+val("ga");if(!a)return;db.expenses.push({id:gid(),date:val("gd"),concept:val("gc"),cat:val("gx"),amount:a,by:me.u});log("Gasto registrado",val("gc"));save();renderAll()}
function cash(){let d=today(),s=db.sales.filter(x=>x.date===d&&!x.annulled),tot=s.reduce((a,x)=>a+x.total,0),g=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);document.getElementById("caja").innerHTML=`<h1>Cierre de caja</h1><div class="grid"><div class="card">Ventas<div class="metric">${money(tot)}</div></div><div class="card">Efectivo<div class="metric">${money(s.filter(x=>x.pay==="Efectivo").reduce((a,x)=>a+x.total,0))}</div></div><div class="card">Yape/Plin<div class="metric">${money(s.filter(x=>x.pay==="Yape/Plin").reduce((a,x)=>a+x.total,0))}</div></div><div class="card">Tarjeta<div class="metric">${money(s.filter(x=>x.pay==="Tarjeta").reduce((a,x)=>a+x.total,0))}</div></div></div><div class="card">Gastos: <b>${money(g)}</b> · Neto: <b>${money(tot-g)}</b><br><br>${admin()?'<button onclick="closeCash()">Cerrar caja</button>':""}</div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Ventas</th><th>Gastos</th><th>Neto</th><th>Usuario</th></tr></thead><tbody>${db.closures.map(c=>`<tr><td>${c.date}</td><td>${money(c.sales)}</td><td>${money(c.expenses)}</td><td>${money(c.net)}</td><td>${c.by}</td></tr>`).join("")}</tbody></table></div>`}
function closeCash(){let d=today(),s=db.sales.filter(x=>x.date===d&&!x.annulled),tot=s.reduce((a,x)=>a+x.total,0),g=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);if(db.closures.some(x=>x.date===d))return alert("Caja ya cerrada.");db.closures.push({date:d,sales:tot,expenses:g,net:tot-g,by:me.u});log("Caja cerrada",d);save();renderAll()}
function reports(){let m=today().slice(0,7),s=db.sales.filter(x=>x.date.startsWith(m)&&!x.annulled),prod=s.filter(x=>x.kind==="product"),services=s.filter(x=>x.kind==="service"),rev=s.reduce((a,x)=>a+x.total,0),cost=prod.reduce((a,x)=>a+(x.costUnit||0)*x.qty,0);document.getElementById("reportes").innerHTML=`<h1>Reportes</h1><div class="grid"><div class="card">Ingresos<div class="metric">${money(rev)}</div></div><div class="card">Ventas de productos<div class="metric">${money(prod.reduce((a,x)=>a+x.total,0))}</div></div><div class="card">Costo productos<div class="metric">${money(cost)}</div></div><div class="card">Margen bruto productos<div class="metric">${money(prod.reduce((a,x)=>a+x.total,0)-cost)}</div></div></div><div class="card"><h2>Ventas por barbero</h2>${db.barbers.map(b=>{let x=s.filter(z=>z.barberId===b.id),t=x.reduce((a,z)=>a+z.total,0),c=b.mode==="percentage"?t*b.percent/100:0;return`<p><b>${e(b.name)}</b>: ${money(t)} · comisión ${money(c)}</p>`}).join("")}</div>`}
function config(){document.getElementById("config").innerHTML=`<h1>Configuración</h1><div class="card"><p><b>Seguridad:</b> el barbero puede registrar ventas, pero no puede anularlas ni modificar stock, gastos o cierres.</p>${admin()?`<button onclick="backup()">💾 Descargar respaldo</button> <button class="danger" onclick="reset()">Limpiar datos de prueba</button>`:""}<p class="muted">Esta versión HTML guarda los datos localmente en el navegador. Antes de usarla con datos reales en Internet debe conectarse a un backend y una base de datos segura.</p></div><div class="card"><h2>Auditoría</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${db.audit.slice().reverse().slice(0,100).map(a=>`<tr><td>${a.date}</td><td>${a.user}</td><td>${e(a.action)}</td><td>${e(a.detail)}</td></tr>`).join("")}</tbody></table></div></div>`}
function backup(){let a=document.createElement("a"),b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="JC-Barberia-respaldo-"+today()+".json";a.click()}
function reset(){if(confirm("¿Borrar todos los datos de prueba?")){db=fresh();save();renderAll()}}
function openModal(t,b){document.getElementById("mt").textContent=t;document.getElementById("mb").innerHTML=b;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
if(me)renderAll();
</script>
</body></html>
